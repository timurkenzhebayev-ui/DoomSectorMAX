name: Build One Tap Flashlight APK

on:
  push:
    branches: [ "flashlight-toggle" ]
    paths:
      - "flashlight/**"
      - ".github/workflows/build-flashlight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p flashlight --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p build
          cp flashlight/app/build/outputs/apk/debug/app-debug.apk build/OneTapFlashlight.apk
          ls -lh build/OneTapFlashlight.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneTapFlashlight-apk
          path: build/OneTapFlashlight.apk
          if-no-files-found: error
          retention-days: 30
