name: Build HOUSE ASSAULT v2 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Godot 4.4 Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Generate local game assets
        run: |
          python -m pip install --quiet pillow
          python tools/generate_assets.py

      - name: Fetch CC0 FPS assets
        run: |
          mkdir -p assets/models assets/textures assets/audio
          BASE="https://raw.githubusercontent.com/petroulacl/fps-asset-kit/a19b7458a593598211c95ec46ef4eb4b6d1f94d7"
          wget -q "$BASE/weapons/flat_guns_west/Flat%20Guns%20West/GLB/Pistol_Full_West.glb" -O assets/models/pistol.glb
          wget -q "$BASE/textures/Plaster001/Plaster001_2K-JPG_Color.jpg" -O /tmp/plaster_color.jpg
          wget -q "$BASE/textures/Plaster001/Plaster001_2K-JPG_NormalGL.jpg" -O /tmp/plaster_normal.jpg
          wget -q "$BASE/textures/Plaster001/Plaster001_2K-JPG_Roughness.jpg" -O /tmp/plaster_rough.jpg
          wget -q "$BASE/sfx/gunshots/game_gunshot.wav" -O assets/audio/shot.wav
          python - <<'PY'
          from PIL import Image
          for src, dst in [
              ('/tmp/plaster_color.jpg','assets/textures/plaster_color.jpg'),
              ('/tmp/plaster_normal.jpg','assets/textures/plaster_normal.jpg'),
              ('/tmp/plaster_rough.jpg','assets/textures/plaster_rough.jpg')]:
              im=Image.open(src).convert('RGB')
              im=im.resize((1024,1024), Image.Resampling.LANCZOS)
              im.save(dst, quality=88, optimize=True)
          PY
          ls -lh assets/models/pistol.glb assets/textures/plaster_*.jpg assets/audio/shot.wav

      - name: Download Godot 4.4.1 and templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Configure Godot Android export
        run: |
          mkdir -p ~/.config/godot ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Import and syntax-check project
        run: |
          ./godot --headless --editor --path . --import --quit

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./godot --headless --verbose --path . --export-debug "Android" build/HouseAssault-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HouseAssault-v2-apk
          path: build/HouseAssault-v2.apk
          if-no-files-found: error
          retention-days: 30
